<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comfortaa', cursive, sans-serif; }
    body {
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%; animation: gradientBG 12s ease infinite;
      min-height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
      overflow: hidden; position: relative;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .bg-heart {
      position: absolute; bottom: -30px; font-size: 1.2rem; pointer-events: none;
      animation: floatUp 6s linear infinite; opacity: 0.7; z-index: 1;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-105vh) scale(1.3) rotate(360deg); opacity: 0; }
    }

    .container {
      width: 88%; max-width: 360px; padding: 30px 20px;
      background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: 30px; border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 40px rgba(255, 105, 180, 0.2); z-index: 10;
    }
    h2 { color: #ff477e; margin-bottom: 6px; font-size: 1.4rem; }
    p { color: #6c5ce7; margin-bottom: 15px; font-size: 0.88rem; }
    .pin-display { font-size: 2rem; letter-spacing: 10px; margin-bottom: 18px; min-height: 40px; color: #ff477e; font-weight: bold; }
    
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 240px; margin: 0 auto; }
    .key {
      background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 182, 193, 0.6);
      color: #ff477e; font-size: 1.25rem; padding: 14px; border-radius: 50%; cursor: pointer;
      font-weight: bold; transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.15);
    }
    .key:active { transform: scale(0.88); background: #ff758c; color: white; }
  </style>
</head>
<body>

  <!-- Custom SFX Audio -->
  <audio id="clickSfx" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
  <audio id="magicSfx" src="https://assets.mixkit.co/active_storage/sfx/2014/2014-preview.mp3" preload="auto"></audio>

  <div class="container">
    <h2>🔒 Secret Passcode</h2>
    <p>Enter secret code to unlock</p>
    <div class="pin-display" id="pinDisplay">____</div>
    <div class="keypad">
      <button class="key" onclick="pressKey('1')">1</button>
      <button class="key" onclick="pressKey('2')">2</button>
      <button class="key" onclick="pressKey('3')">3</button>
      <button class="key" onclick="pressKey('4')">4</button>
      <button class="key" onclick="pressKey('5')">5</button>
      <button class="key" onclick="pressKey('6')">6</button>
      <button class="key" onclick="pressKey('7')">7</button>
      <button class="key" onclick="pressKey('8')">8</button>
      <button class="key" onclick="pressKey('9')">9</button>
      <button class="key" onclick="clearPin()">C</button>
      <button class="key" onclick="pressKey('0')">0</button>
      <button class="key" onclick="checkPin()">✓</button>
    </div>
  </div>

  <script>
    let currentPin = "";
    const correctPin = "3108";

    function playClick() {
      const audio = document.getElementById('clickSfx');
      audio.currentTime = 0;
      audio.play().catch(e => {});
    }

    function pressKey(num) {
      playClick();
      if (currentPin.length < 4) { currentPin += num; updateDisplay(); }
    }
    function clearPin() { playClick(); currentPin = ""; updateDisplay(); }
    function updateDisplay() { document.getElementById('pinDisplay').innerText = currentPin.padEnd(4, '_'); }
    
    function checkPin() {
      if (currentPin === correctPin) {
        document.getElementById('magicSfx').play().catch(e => {});
        confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
        setTimeout(() => { window.location.href = "cake.html"; }, 800);
      } else {
        alert("Incorrect PIN! Try again ❤️");
        clearPin();
      }
    }

    function createBgHeart() {
      const h = document.createElement('div');
      h.classList.add('bg-heart');
      const icons = ['💗', '💖', '✨', '🌸', '💕'];
      h.innerText = icons[Math.floor(Math.random() * icons.length)];
      h.style.left = Math.random() * 90 + 5 + "vw";
      h.style.animationDuration = Math.random() * 3 + 4 + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 7000);
    }
    setInterval(createBgHeart, 450);
  </script>
</body>
</html>

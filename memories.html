<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Memories 📸</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Comfortaa', cursive, sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%; animation: gradientBG 12s ease infinite;
      min-height: 100vh; padding: 30px 15px 50px; text-align: center; overflow-x: hidden;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    h1 { color: #ff477e; font-size: 1.6rem; margin-bottom: 5px; }
    p.sub-title { color: #6c5ce7; font-size: 0.85rem; margin-bottom: 25px; }

    .gallery-grid {
      display: flex; flex-direction: column; align-items: center; gap: 25px;
      max-width: 400px; margin: 0 auto;
    }

    .polaroid {
      background: #ffffff; padding: 12px 12px 18px; border-radius: 8px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15); width: 88%; max-width: 310px;
      position: relative; transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    /* Playful Polaroid Rotations */
    .polaroid:nth-child(odd) { transform: rotate(-2deg); }
    .polaroid:nth-child(even) { transform: rotate(2.5deg); }
    .polaroid:hover, .polaroid:active { transform: scale(1.03) rotate(0deg); z-index: 10; box-shadow: 0 15px 30px rgba(0,0,0,0.22); }

    .polaroid-img {
      width: 100%; height: 260px; object-fit: cover; border-radius: 4px;
      background: #eee; display: block;
    }

    .caption {
      font-family: 'Caveat', cursive; font-size: 1.35rem; color: #ff477e;
      margin-top: 10px; line-height: 1.2; font-weight: bold;
    }

    .pin {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 16px; height: 16px; background: #ff758c; border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3); border: 2px solid white;
    }

    .btn {
      background: linear-gradient(45deg, #ff758c, #ff7eb3); border: none; color: white;
      padding: 14px 32px; border-radius: 30px; font-weight: bold; cursor: pointer;
      text-decoration: none; display: inline-block; margin-top: 35px;
      box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4); transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.92); }
  </style>
</head>
<body>

  <h1>Our Memories 📸</h1>
  <p class="sub-title">A few of my favorite moments with you 💕</p>

  <div class="gallery-grid">
    
    <!-- Photo 1 -->
    <div class="polaroid">
      <div class="pin"></div>
      <img src="photo1.jpg" alt="Memory 1" class="polaroid-img">
      <div class="caption">Where it all began ✨</div>
    </div>

    <!-- Photo 2 -->
    <div class="polaroid">
      <div class="pin"></div>
      <img src="photo2.jpg" alt="Memory 2" class="polaroid-img">
      <div class="caption">Your beautiful smile 😍</div>
    </div>

    <!-- Photo 3 -->
    <div class="polaroid">
      <div class="pin"></div>
      <img src="photo3.jpg" alt="Memory 3" class="polaroid-img">
      <div class="caption">Late night laughs & talks 🌙</div>
    </div>

    <!-- Photo 4 -->
    <div class="polaroid">
      <div class="pin"></div>
      <img src="photo4.jpg" alt="Memory 4" class="polaroid-img">
      <div class="caption">Silly little adventures 🚗</div>
    </div>

    <!-- Photo 5 -->
    <div class="polaroid">
      <div class="pin"></div>
      <img src="photo5.jpg" alt="Memory 5" class="polaroid-img">
      <div class="caption">Forever my favorite person 💖</div>
    </div>

    <!-- Photo 6 -->
    <div class="polaroid">
      <div class="pin"></div>
      <img src="photo6.jpg" alt="Memory 6" class="polaroid-img">
      <div class="caption">Making core memories 🌸</div>
    </div>

    <!-- Photo 7 -->
    <div class="polaroid">
      <div class="pin"></div>
      <img src="photo7.jpg" alt="Memory 7" class="polaroid-img">
      <div class="caption">To many more years together! 🥂</div>
    </div>

  </div>

  <a href="player.html" class="btn">Read Special Letter 💌</a>

</body>
</html>

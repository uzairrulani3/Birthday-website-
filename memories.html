<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Comfortaa', cursive, sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%; animation: gradientBG 12s ease infinite;
      min-height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
      overflow: hidden; position: relative;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .bg-heart {
      position: absolute; bottom: -30px; font-size: 1.2rem; pointer-events: none;
      animation: floatUp 6s linear infinite; opacity: 0.7; z-index: 1;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-105vh) scale(1.3) rotate(360deg); opacity: 0; }
    }

    .container {
      width: 88%; max-width: 370px; padding: 25px 20px;
      background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: 30px; border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 40px rgba(255, 105, 180, 0.2); z-index: 10;
    }
    h2 { color: #ff477e; margin-bottom: 15px; font-size: 1.4rem; }
    
    /* Realistic Tilted Polaroid Card */
    .polaroid-card {
      position: relative; background: #ffffff; padding: 12px 12px 25px; border-radius: 8px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.12); margin-bottom: 18px; transform: rotate(-2deg);
      transition: transform 0.3s ease;
    }
    .polaroid-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 4px; }
    .caption {
      font-family: 'Caveat', cursive; font-size: 1.4rem; color: #ff477e; margin-top: 10px; font-weight: bold;
    }
    .sticker {
      position: absolute; top: -10px; right: -10px; font-size: 2.2rem;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }
    .btn {
      background: linear-gradient(45deg, #ff758c, #ff7eb3); border: none; color: white;
      padding: 12px 28px; border-radius: 30px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block;
      box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn:active { transform: scale(0.92); }
  </style>
</head>
<body>
  <div class="container">
    <h2>📸 Our Memories</h2>
    
    <div class="polaroid-card">
      <img id="photo" src="images/photo1.jpg" alt="Memory" onerror="this.src='https://via.placeholder.com/300x250?text=Photo+1'">
      <div class="sticker" id="sticker">💖</div>
      <div class="caption" id="caption">Best times together ✨</div>
    </div>

    <button id="nextBtn" class="btn" onclick="nextPhoto()">Next Photo ➔</button>
  </div>

  <script>
    const photos = [
      { src: "images/photo1.jpg", sticker: "💖", caption: "Best times together ✨" },
      { src: "images/photo2.jpg", sticker: "🌸", caption: "Your gorgeous smile 😊" },
      { src: "images/photo3.jpg", sticker: "✨", caption: "Unforgettable days 💕" },
      { src: "images/photo4.jpg", sticker: "💌", caption: "Little precious moments 🎀" },
      { src: "images/photo5.jpg", sticker: "🎀", caption: "Always laughing with you 🥰" },
      { src: "images/photo6.jpg", sticker: "🥰", caption: "Pure happiness ❤️" },
      { src: "images/photo7.jpg", sticker: "👑", caption: "Birthday Queen! 👑" }
    ];
    let index = 0;

    function nextPhoto() {
      if (index < photos.length - 1) {
        index++;
        document.getElementById('photo').src = photos[index].src;
        document.getElementById('sticker').innerText = photos[index].sticker;
        document.getElementById('caption').innerText = photos[index].caption;
        
        if (index === photos.length - 1) {
          const btn = document.getElementById('nextBtn');
          btn.innerText = "Let's Pop Balloons 🎈";
          btn.onclick = function() { window.location.href = "wishes.html"; };
        }
      }
    }

    function createBgHeart() {
      const h = document.createElement('div');
      h.classList.add('bg-heart');
      const icons = ['💗', '💖', '✨', '🌸', '💕'];
      h.innerText = icons[Math.floor(Math.random() * icons.length)];
      h.style.left = Math.random() * 90 + 5 + "vw";
      h.style.animationDuration = Math.random() * 3 + 4 + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 7000);
    }
    setInterval(createBgHeart, 450);
  </script>
</body>
</html>

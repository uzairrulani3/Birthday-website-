<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Memories 📸</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%; animation: gradientBG 15s ease infinite;
      min-height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .container {
      width: 88%; max-width: 380px; padding: 25px 20px; background: rgba(255, 255, 255, 0.5);
      border-radius: 25px; backdrop-filter: blur(15px); border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
    }
    h2 { color: #ff477e; margin-bottom: 15px; }
    .photo-card {
      position: relative; background: #fff; padding: 12px 12px 25px; border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1); margin-bottom: 20px;
    }
    .photo-card img { width: 100%; height: 270px; object-fit: cover; border-radius: 10px; }
    
    /* Cute sticker overlay */
    .sticker {
      position: absolute; bottom: 5px; right: 15px; font-size: 1.8rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); animation: floatSticker 2s infinite alternate ease-in-out;
    }
    @keyframes floatSticker { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }

    .btn {
      background: linear-gradient(45deg, #ff758c, #ff7eb3); border: none; color: white;
      padding: 12px 28px; border-radius: 25px; font-weight: bold; cursor: pointer;
      text-decoration: none; display: inline-block; box-shadow: 0 4px 15px rgba(255,117,140,0.4);
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <div class="container">
    <h2>📸 Sweet Memories</h2>
    
    <div class="photo-card">
      <img id="photo" src="images/photo1.jpg" alt="Memory">
      <div class="sticker" id="sticker">💖</div>
    </div>

    <button id="nextBtn" class="btn" onclick="nextPhoto()">Next Photo ➔</button>
  </div>

  <script>
    const photos = [
      { src: "images/photo1.jpg", sticker: "💖" },
      { src: "images/photo2.jpg", sticker: "🌸" },
      { src: "images/photo3.jpg", sticker: "✨" },
      { src: "images/photo4.jpg", sticker: "💌" },
      { src: "images/photo5.jpg", sticker: "🎀" },
      { src: "images/photo6.jpg", sticker: "🥰" },
      { src: "images/photo7.jpg", sticker: "👑" }
    ];
    let index = 0;

    function nextPhoto() {
      if (index < photos.length - 1) {
        index++;
        document.getElementById('photo').src = photos[index].src;
        document.getElementById('sticker').innerText = photos[index].sticker;
        
        if (index === photos.length - 1) {
          const btn = document.getElementById('nextBtn');
          btn.innerText = "Let's Pop Balloons 🎈";
          btn.onclick = function() { window.location.href = "wishes.html"; };
        }
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Balloons 🎈</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%; animation: gradientBG 15s ease infinite;
      min-height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .container {
      width: 88%; max-width: 380px; padding: 30px 20px; background: rgba(255, 255, 255, 0.5);
      border-radius: 25px; backdrop-filter: blur(15px); border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
    }
    h2 { color: #ff477e; margin-bottom: 10px; }
    p { color: #555; font-size: 0.95rem; }
    
    .balloon-box { display: flex; justify-content: space-around; margin: 35px 0; }
    .balloon {
      width: 55px; height: 70px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      cursor: pointer; position: relative; transition: transform 0.2s;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
    }
    .balloon::after { content: '📍'; position: absolute; bottom: -12px; left: 20px; font-size: 10px; }
    .balloon.popped { visibility: hidden; }
    
    .wish-display { min-height: 55px; color: #ff477e; font-weight: 600; font-size: 1rem; margin-bottom: 20px; }
    
    .btn {
      background: linear-gradient(45deg, #ff758c, #ff7eb3); border: none; color: white;
      padding: 12px 28px; border-radius: 25px; font-weight: bold; cursor: pointer; text-decoration: none;
      display: inline-block; box-shadow: 0 4px 15px rgba(255,117,140,0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎈 Pop a Balloon!</h2>
    <p>Tap each balloon to discover sweet wishes ✨</p>

    <div class="balloon-box">
      <div class="balloon" style="background: #ff758c;" onclick="pop(this, 'May your year be filled with endless smiles & warmth! ✨🌸')"></div>
      <div class="balloon" style="background: #ff7eb3;" onclick="pop(this, 'Wishing you all the love & sweet magic in the world! 💕🧸')"></div>
      <div class="balloon" style="background: #a88beb;" onclick="pop(this, 'Always keep shining bright as the sweetest star! 🌟💖')"></div>
    </div>

    <div class="wish-display" id="wishText">Tap a balloon above...</div>

    <a href="player.html" class="btn">Read My Letter 💌</a>
  </div>

  <script>
    function pop(element, wish) {
      // Balloon pop sound effect
      let popAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
      popAudio.play();

      element.classList.add('popped');
      document.getElementById('wishText').innerText = wish;
    }
  </script>
</body>
</html>

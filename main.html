<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Ayesha 💗</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #ffd1e8; }
    iframe { border: none; width: 100vw; height: 100vh; display: block; }
    #startScreen {
      position: fixed; inset: 0; background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif; font-size: 1.4rem; color: #ff477e; font-weight: bold;
      z-index: 999; cursor: pointer; text-align: center; padding: 20px;
    }
    .start-card {
      background: rgba(255, 255, 255, 0.75); padding: 25px 35px; border-radius: 25px;
      backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(255, 182, 193, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <!-- Clean Start Screen without the "Turn sound on!" text -->
  <div id="startScreen">
    <div class="start-card">
      🎁 Tap to Begin 💗
    </div>
  </div>

  <audio id="bgm" loop preload="auto">
    <source src="music/birthday.mp3" type="audio/mpeg">
  </audio>

  <!-- Starts DIRECTLY on passcode.html -->
  <iframe id="frame" src="passcode.html"></iframe>

  <script>
    const music = document.getElementById("bgm");
    const start = document.getElementById("startScreen");

    start.addEventListener("click", () => {
      music.currentTime = 0;
      music.play().catch(e => console.log("Audio play error:", e));
      start.style.display = "none";
    });
  </script>

</body>
</html>

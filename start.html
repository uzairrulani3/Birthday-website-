<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Surprise For You ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', cursive, sans-serif; }
    body {
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
      overflow: hidden;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card {
      background: rgba(255, 255, 255, 0.45);
      padding: 40px 25px; border-radius: 30px;
      backdrop-filter: blur(15px); border: 2px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4);
      max-width: 350px; width: 85%;
    }
    h1 { color: #ff477e; font-size: 1.8rem; margin-bottom: 15px; }
    p { color: #6c5ce7; font-size: 1rem; margin-bottom: 25px; font-weight: 600; }
    .start-btn {
      background: linear-gradient(45deg, #ff758c, #ff7eb3);
      border: none; color: white; padding: 15px 35px; border-radius: 30px;
      font-size: 1.2rem; font-weight: bold; cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 117, 140, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn:hover { transform: scale(1.08); box-shadow: 0 10px 25px rgba(255, 117, 140, 0.7); }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎁 A Special Gift</h1>
    <p>Turn on your sound & tap below to unlock the surprise!</p>
    <button class="start-btn" onclick="startSurprise()">Tap to Begin ✨</button>
  </div>

  <audio id="bgSong" loop preload="auto">
    <source src="music/birthday.mp3" type="audio/mpeg">
  </audio>

  <script>
    function startSurprise() {
      const audio = document.getElementById('bgSong');
      audio.play().then(() => {
        window.location.href = "index.html";
      }).catch(() => {
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>

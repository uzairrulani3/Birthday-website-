<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Birthday Surprise ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="index-page">

<div class="page">

    <div class="photo-frame">
        <img src="images/photo1.jpg" alt="Our Photo"
             onerror="this.style.display='none';">
        <div class="photo-placeholder">
            Our Photo ❤️
        </div>
        <div class="with-love">With love ❤️</div>
    </div>

    <h1>Enter a passcode</h1>

    <div class="password-boxes">
        <span id="box1"></span>
        <span id="box2"></span>
        <span id="box3"></span>
        <span id="box4"></span>
    </div>

    <div class="keypad">

        <button onclick="enterNumber('1')">1</button>
        <button onclick="enterNumber('2')">2</button>
        <button onclick="enterNumber('3')">3</button>

        <button onclick="enterNumber('4')">4</button>
        <button onclick="enterNumber('5')">5</button>
        <button onclick="enterNumber('6')">6</button>

        <button onclick="enterNumber('7')">7</button>
        <button onclick="enterNumber('8')">8</button>
        <button onclick="enterNumber('9')">9</button>

        <button class="zero" onclick="enterNumber('0')">0</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>

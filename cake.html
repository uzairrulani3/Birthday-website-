<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make a Wish 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%; animation: gradientBG 12s ease infinite;
      min-height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
      overflow: hidden;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .container {
      width: 88%; max-width: 380px; padding: 30px 20px; background: rgba(255, 255, 255, 0.6);
      border-radius: 25px; backdrop-filter: blur(15px); border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4); z-index: 10;
    }
    h2 { color: #ff477e; margin-bottom: 10px; }
    p { color: #555; font-size: 0.95rem; }
    
    .cake-wrapper { position: relative; width: 170px; margin: 35px auto 15px; }
    .cake-svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.1)); }

    /* Glowing animated flame */
    .flame {
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
      width: 22px; height: 32px;
      background: radial-gradient(ellipse at bottom, #ffffff 0%, #ffeb3b 25%, #ff5722 80%, rgba(255,87,34,0) 100%);
      border-radius: 50% 50% 20% 20%; cursor: pointer;
      box-shadow: 0 0 20px #ff9800, 0 0 35px #ff5722, 0 0 50px #ffeb3b;
      animation: flicker 0.6s infinite alternate ease-in-out;
    }
    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.95; }
      100% { transform: translateX(-50%) scale(1.25) rotate(2deg); opacity: 1; box-shadow: 0 0 25px #ff9800, 0 0 45px #ff5722; }
    }
    
    .btn {
      background: linear-gradient(45deg, #ff758c, #ff7eb3); border: none; color: white;
      padding: 12px 28px; border-radius: 25px; font-weight: bold; cursor: pointer;
      text-decoration: none; display: inline-block; margin-top: 20px;
      box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
    }

    .rain-drop {
      position: fixed; top: -60px; color: #ff3366; font-weight: 800;
      font-size: 1.1rem; pointer-events: none; animation: fallStraight 3s linear forwards;
      z-index: 100; text-shadow: 0 0 8px rgba(255,255,255,1), 0 0 12px rgba(255, 71, 126, 0.8);
      white-space: nowrap;
    }
    @keyframes fallStraight {
      0% { transform: translateY(0); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎂 Blow Out The Candle!</h2>
    <p>Tap the glowing candle flame to blow breeze & make a wish!</p>
    
    <div class="cake-wrapper">
      <!-- Glowing Candle Flame -->
      <div id="flame" class="flame" onclick="blowCandle()"></div>
      
      <!-- Built-in High Quality Cake SVG -->
      <svg class="cake-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Candle Stick -->
        <rect x="94" y="18" width="12" height="35" rx="4" fill="#ff7eb3" stroke="#ffffff" stroke-width="2" />
        <!-- Top Cake Frosting -->
        <path d="M40,110 C40,85 160,85 160,110 L160,120 C160,130 40,130 40,120 Z" fill="#ffb6c1" />
        <!-- Cake Base Layer -->
        <rect x="30" y="115" width="140" height="50" rx="12" fill="#fff0f5" />
        <path d="M30,135 Q50,148 70,135 T110,135 T150,135 T170,135 L170,120 L30,120 Z" fill="#ff758c" />
        <!-- Decorative Cream Dots -->
        <circle cx="50" cy="115" r="6" fill="#ffffff" />
        <circle cx="85" cy="115" r="6" fill="#ffffff" />
        <circle cx="115" cy="115" r="6" fill="#ffffff" />
        <circle cx="150" cy="115" r="6" fill="#ffffff" />
        <!-- Plate -->
        <ellipse cx="100" cy="168" rx="85" ry="12" fill="#e2e8f0" />
      </svg>
    </div>

    <div id="nextSection" style="display: none;">
      <p style="color: #ff477e; font-weight: bold; margin-top: 10px;">✨ Your wish has been made! ✨</p>
      <a href="memories.html" class="btn">See Our Memories ➔</a>
    </div>
  </div>

  <script>
    // Smooth, soft wind breeze synthesizer
    function playBreezeSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = ctx.sampleRate * 1.5;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(350, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 1.2);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      whiteNoise.start();
    }

    function blowCandle() {
      playBreezeSound();
      document.getElementById('flame').style.display = 'none';
      document.getElementById('nextSection').style.display = 'block';

      for (let i = 0; i < 35; i++) {
        setTimeout(createRainDrop, i * 120);
      }
    }

    function createRainDrop() {
      const drop = document.createElement('div');
      drop.classList.add('rain-drop');
      drop.innerText = "Happy birthday ❤️❤️";
      drop.style.left = Math.random() * 85 + 5 + "vw";
      document.body.appendChild(drop);
      setTimeout(() => drop.remove(), 3200);
    }
  </script>
</body>
</html>

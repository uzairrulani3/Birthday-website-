<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make a Wish 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%; animation: gradientBG 12s ease infinite;
      min-height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
      overflow: hidden; position: relative;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .bg-heart {
      position: absolute; color: rgba(255, 105, 180, 0.4); font-size: 1.5rem;
      animation: floatUp 7s linear infinite; pointer-events: none;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .container {
      width: 88%; max-width: 380px; padding: 30px 20px; background: rgba(255, 255, 255, 0.6);
      border-radius: 25px; backdrop-filter: blur(15px); border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4); z-index: 10;
    }
    h2 { color: #ff477e; margin-bottom: 10px; }
    p { color: #555; font-size: 0.95rem; }
    
    .cake-wrapper { position: relative; width: 170px; margin: 30px auto 15px; }
    
    /* Cute vector SVG Birthday Cake */
    .cake-svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.1)); }

    /* Animated candle flame */
    .flame {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 18px; height: 26px; background: radial-gradient(ellipse at bottom, #ffeb3b 0%, #ff5722 100%);
      border-radius: 50% 50% 20% 20%; cursor: pointer;
      box-shadow: 0 0 15px #ff9800; animation: flicker 0.5s infinite alternate;
    }
    @keyframes flicker { 0% { transform: translateX(-50%) scale(1); } 100% { transform: translateX(-50%) scale(1.25); } }
    
    .btn {
      background: linear-gradient(45deg, #ff758c, #ff7eb3); border: none; color: white;
      padding: 12px 28px; border-radius: 25px; font-weight: bold; cursor: pointer;
      text-decoration: none; display: inline-block; margin-top: 20px;
      box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
    }

    /* Falling text rain */
    .rain-drop {
      position: fixed; top: -60px; color: #ff3366; font-weight: 800;
      font-size: 1.1rem; pointer-events: none; animation: fallStraight 3s linear forwards;
      z-index: 100; text-shadow: 0 0 8px rgba(255,255,255,1), 0 0 12px rgba(255, 71, 126, 0.8);
      white-space: nowrap;
    }
    @keyframes fallStraight {
      0% { transform: translateY(0); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="bg-heart" style="left: 10%; animation-delay: 0s;">💖</div>
  <div class="bg-heart" style="left: 40%; animation-delay: 3s;">✨</div>
  <div class="bg-heart" style="left: 75%; animation-delay: 1.5s;">💕</div>

  <div class="container">
    <h2>🎂 Blow Out The Candle!</h2>
    <p>Tap the glowing flame to blow breeze & make a wish!</p>
    
    <div class="cake-wrapper">
      <!-- Flame -->
      <div id="flame" class="flame" onclick="blowCandle()"></div>
      
      <!-- Guaranteed SVG Birthday Cake Graphic -->
      <svg class="cake-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Candle -->
        <rect x="95" y="35" width="10" height="30" rx="3" fill="#ff7eb3" />
        <!-- Top Tier -->
        <path d="M40,110 C40,90 160,90 160,110 L160,120 C160,130 40,130 40,120 Z" fill="#ffb6c1" />
        <!-- Cake Layers -->
        <rect x="30" y="115" width="140" height="50" rx="10" fill="#fff0f5" />
        <path d="M30,135 Q50,145 70,135 T110,135 T150,135 T170,135 L170,120 L30,120 Z" fill="#ff758c" />
        <!-- Plate -->
        <ellipse cx="100" cy="170" rx="85" ry="12" fill="#e0e0e0" />
      </svg>
    </div>

    <div id="nextSection" style="display: none;">
      <p style="color: #ff477e; font-weight: bold; margin-top: 10px;">✨ Your wish has been made! ✨</p>
      <a href="memories.html" class="btn">See Our Memories ➔</a>
    </div>
  </div>

  <audio id="bgSong" loop autoplay src="music/birthday.mp3"></audio>

  <script>
    // Smooth, realistic breeze wind audio synthesizer
    function playBreezeSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = ctx.sampleRate * 1.5;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(400, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 1.5);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      whiteNoise.start();
    }

    function blowCandle() {
      playBreezeSound();
      document.getElementById('flame').style.display = 'none';
      document.getElementById('nextSection').style.display = 'block';

      for (let i = 0; i < 35; i++) {
        setTimeout(createRainDrop, i * 120);
      }
    }

    function createRainDrop() {
      const drop = document.createElement('div');
      drop.classList.add('rain-drop');
      drop.innerText = "Happy birthday ❤️❤️";
      drop.style.left = Math.random() * 85 + 5 + "vw";
      document.body.appendChild(drop);
      setTimeout(() => drop.remove(), 3200);
    }
  </script>
</body>
</html>

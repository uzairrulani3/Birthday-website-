<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make a Wish 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%; animation: gradientBG 15s ease infinite;
      min-height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
      overflow: hidden; position: relative;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .container {
      width: 88%; max-width: 380px; padding: 30px 20px; background: rgba(255, 255, 255, 0.5);
      border-radius: 25px; backdrop-filter: blur(15px); border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3); z-index: 10;
    }
    h2 { color: #ff477e; margin-bottom: 10px; }
    p { color: #555; font-size: 0.95rem; }
    
    .cake-wrapper { position: relative; width: 180px; margin: 40px auto 20px; }
    .cake-img { width: 100%; display: block; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.1)); }
    
    .flame-img {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      width: 25px; cursor: pointer; animation: flicker 0.6s infinite alternate;
    }
    @keyframes flicker { 0% { transform: translateX(-50%) scale(1); } 100% { transform: translateX(-50%) scale(1.2); } }
    
    .btn {
      background: linear-gradient(45deg, #ff758c, #ff7eb3); border: none; color: white;
      padding: 12px 28px; border-radius: 25px; font-weight: bold; cursor: pointer;
      text-decoration: none; display: inline-block; margin-top: 20px;
      box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
    }

    /* Falling text styling */
    .rain-item {
      position: absolute; top: -50px; color: #ff477e; font-weight: bold;
      font-size: 1.2rem; pointer-events: none; animation: fall 3.5s linear forwards;
      z-index: 100; text-shadow: 0 2px 5px rgba(255,255,255,0.8);
    }
    @keyframes fall {
      to { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎂 Blow Out The Candle!</h2>
    <p>Tap the candle flame to blow it out and make a wish!</p>
    
    <div class="cake-wrapper">
      <img src="https://cdn-icons-png.flaticon.com/512/3132/3132693.png" class="cake-img" alt="Cute Cake">
      <img src="https://cdn-icons-png.flaticon.com/512/785/785116.png" id="flame" class="flame-img" onclick="blowCandle()" alt="Candle Flame">
    </div>

    <div id="nextSection" style="display: none;">
      <p style="color: #ff477e; font-weight: bold;">✨ Your wish has been made! ✨</p>
      <a href="memories.html" class="btn">See Our Memories ➔</a>
    </div>
  </div>

  <script>
    function blowCandle() {
      // Play blow audio effect
      let blowAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3');
      blowAudio.play();

      document.getElementById('flame').style.display = 'none';
      document.getElementById('nextSection').style.display = 'block';

      // Trigger "Happy birthday ❤️❤️" raining confetti
      for (let i = 0; i < 30; i++) {
        setTimeout(createRainDrop, i * 120);
      }
    }

    function createRainDrop() {
      const drop = document.createElement('div');
      drop.classList.add('rain-item');
      drop.innerText = "Happy birthday ❤️❤️";
      drop.style.left = Math.random() * 80 + 10 + "vw";
      drop.style.fontSize = (Math.random() * 0.5 + 0.9) + "rem";
      document.body.appendChild(drop);
      setTimeout(() => drop.remove(), 3500);
    }
  </script>
</body>
</html>

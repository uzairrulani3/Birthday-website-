<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Make a Wish 🎂</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="birthdayRain"></div>

<div class="page cake-page">

    <h1 class="wish-title">
        Make a Wish ✨
    </h1>

    <div class="cake">

        <div class="candle candle1">
            <div class="flame"></div>
        </div>

        <div class="candle candle2">
            <div class="flame"></div>
        </div>

        <div class="candle candle3">
            <div class="flame"></div>
        </div>

        <div class="candle candle4">
            <div class="flame"></div>
        </div>

        <div class="candle candle5">
            <div class="flame"></div>
        </div>

        <div class="cake-top">
        </div>

        <div class="cake-bottom">
        </div>

    </div>

    <button id="blowButton" class="main-button">
        💨 Blow the candles
    </button>

    <p id="birthdayMessage" class="hidden birthday-message">
        🎉 HAPPY BIRTHDAY 🎉
    </p>

    <a href="gifts.html" class="back-button">
        ← Back to gifts
    </a>

</div>


<script>

const button = document.getElementById("blowButton");

button.addEventListener("click", function () {

    document.querySelectorAll(".flame").forEach(flame => {
        flame.style.display = "none";
    });

    button.style.display = "none";

    document
        .getElementById("birthdayMessage")
        .classList.remove("hidden");

    createBirthdayRain();

});


function createBirthdayRain() {

    const container =
        document.getElementById("birthdayRain");

    const words = [
        "HAPPY BIRTHDAY ❤️",
        "HAPPY BIRTHDAY 🎂",
        "HAPPY BIRTHDAY 🎉",
        "LOVE YOU ❤️",
        "🎈",
        "✨",
        "💗",
        "🎁"
    ];

    for (let i = 0; i < 70; i++) {

        const item = document.createElement("div");

        item.className = "rain-item";

        item.innerText =
            words[Math.floor(Math.random() * words.length)];

        item.style.left =
            Math.random() * 100 + "%";

        item.style.animationDuration =
            (3 + Math.random() * 5) + "s";

        item.style.animationDelay =
            Math.random() * 2 + "s";

        container.appendChild(item);
    }
}

</script>

</body>
</html>
